<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow" />
  <meta name="revisit-after" content="7 days" />
  <style>
    body { background: #333; color: white; font-family: sans-serif; }
    img { max-width: 800px; border: 2px solid red; margin-bottom: 20px; }
  </style>

  <!-- Responsive Core Styles -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      max-width: 100vw !important;
      overflow-x: hidden !important;
      margin: 0;
      padding: 0;
    }
    img, video {
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 768px) {
      .hero-films, .hero-main, .hero-section, .hero-overlay {
        padding-top: 140px !important;
        min-height: auto !important;
      }
      #sliderContainer .card {
        min-width: 100% !important;
        max-width: 100% !important;
      }
      .services-container .service-card {
        min-width: 100% !important;
        max-width: 100% !important;
      }
      .brands-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 15px !important;
      }
    }
    @media (max-width: 480px) {
      .brands-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
      }
    }
  </style>

</head>
<body>
  <h2>images/herosection.webp</h2>
  <img src="images/herosection.webp" alt="Screensource Herosection" loading="eager" decoding="async">

  <h2>images/herosection-000222.webp</h2>
  <img src="images/herosection-000222.webp" alt="Screensource Herosection 000222" loading="eager" decoding="async">

  <h2>images/hero-01.webp</h2>
  <img src="images/hero-01.webp" alt="Screensource Hero" loading="eager" decoding="async">

  <h2>images/hero-02.webp</h2>
  <img src="images/hero-02.webp" alt="Screensource Hero" loading="eager" decoding="async">

  <h2>images/final-hero-image.webp</h2>
  <img src="images/final-hero-image.webp" alt="Screensource Final Hero" loading="eager" decoding="async">
</body>
</html>
